name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity
        run: |
          git config --global user.email "ci@covtest"
          git config --global user.name "covtest CI"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit and integration tests
        run: pytest test/unittest test/integration -v

  e2e:
    name: "E2E / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@covtest"
          git config --global user.name "covtest CI"

      - name: Install
        run: pip install -e ".[dev]"

      - name: E2E tests
        run: pytest test/e2e -v
