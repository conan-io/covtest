name: Publish to Artifactory

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  publish:
    name: Publish to Artifactory PyPI
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read package version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        run: |
          if curl -fsS "https://conandev.jfrog.io/artifactory/api/pypi/covtest/simple/covtest/" 2>/dev/null \
              | grep -qE "covtest-${{ steps.version.outputs.version }}[.-]"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.check.outputs.exists == 'false'
        run: pip install build twine

      - name: Build distribution
        if: steps.check.outputs.exists == 'false'
        run: python -m build

      - name: Publish to Artifactory
        if: steps.check.outputs.exists == 'false'
        env:
          TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_IDENTITY_TOKEN }}
        run: twine upload --repository-url https://conandev.jfrog.io/artifactory/api/pypi/covtest dist/*

      - name: Skip notice
        if: steps.check.outputs.exists == 'true'
        run: echo "Version ${{ steps.version.outputs.version }} is already published, skipping."
