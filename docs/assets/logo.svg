<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#4527a0"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Target rings -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="white" stroke-width="3" opacity="0.25"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="white" stroke-width="3" opacity="0.45"/>

  <!-- Checkmark — precise hit -->
  <polyline
    points="32,51 44,63 68,37"
    fill="none"
    stroke="white"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
