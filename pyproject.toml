[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "covtest"
version = "0.1.0"
description = "Coverage-guided test selection for pytest"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pytest",
    "coverage",
    "pytest-cov",
    "unidiff",
]

[project.scripts]
covtest = "covtest.cli:main"

[tool.setuptools.packages.find]
include = ["covtest*"]
